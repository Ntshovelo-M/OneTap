<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneTap Real Help — Security Access</title>
    <style>
        body { background-color: #0d0f18; color: white; font-family: 'Segoe UI', Arial; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: #151824; padding: 50px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #252a3a; width: 400px; }
        h2 { color: #e53935; margin-bottom: 30px; letter-spacing: 1px; }
        .stats-preview { display: flex; justify-content: space-between; margin-bottom: 30px; background: #1c2030; padding: 15px; border-radius: 12px; }
        .stat-p { flex: 1; }
        .stat-v { font-size: 20px; font-weight: 800; display: block; }
        .stat-l { font-size: 10px; color: #7a8099; text-transform: uppercase; }
        input { padding: 15px; width: 100%; border-radius: 10px; border: 1px solid #252a3a; margin-bottom: 20px; background: #0d0f18; color: white; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { padding: 15px; width: 100%; background: #e53935; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #f44336; transform: translateY(-2px); }
        .urgent-alert { background: rgba(229, 57, 53, 0.1); border: 1px solid #e53935; color: #e53935; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; display: none; }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="login-box">
    <h2>SECURITY PORTAL</h2>

    <div id="urgent-box" class="urgent-alert">&#128680; ACTIVE EMERGENCY DETECTED! LOG IN IMMEDIATELY!</div>

    <div class="stats-preview">
        <div class="stat-p"><span class="stat-v" style="color:#e53935" id="p-active">0</span><span class="stat-l">Active</span></div>
        <div class="stat-p"><span class="stat-v" style="color:#ffa000" id="p-today">0</span><span class="stat-l">Today</span></div>
        <div class="stat-p"><span class="stat-v" style="color:#43a047" id="p-resolved">0</span><span class="stat-l">Total</span></div>
    </div>

    <input type="password" id="code" placeholder="ENTER ACCESS CODE"><br>
    <button onclick="login()">AUTHORIZE ACCESS</button>

    <div style="margin-top: 25px; border-top: 1px solid #252a3a; padding-top: 15px;">
        <a href="admin_login.html" style="color: #7a8099; text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 1px;">MANAGEMENT PORTAL →</a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDcVYYJ8rWhtF00HBJLwIRgNLNvVVA6X_A",
        authDomain: "onetaprealhelp-ab232.firebaseapp.com",
        databaseURL: "https://onetaprealhelp-ab232-default-rtdb.firebaseio.com",
        projectId: "onetaprealhelp-ab232",
        storageBucket: "onetaprealhelp-ab232.appspot.com",
        messagingSenderId: "531199721908",
        appId: "1:531199721908:android:ddd276990f0608e9a572e1",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // BACKGROUND LISTENING EVEN WHEN LOGGED OUT
    const loginPageSiren = new Audio('https://www.soundjay.com/buttons/sounds/beep-01a.mp3');
    let wasActive = false; // only play on the 0→active edge, not on every unrelated DB write

    db.ref('alerts').on('value', snap => {
        const all = Object.values(snap.val() || {});
        const active = all.filter(a => a.status === 'active' || a.status === 'acknowledged').length;
        const todayCount = all.filter(a => new Date(a.timestamp).toDateString() === new Date().toDateString()).length;
        const totalResolved = all.filter(a => a.status === 'resolved').length;

        // Same staleness rule as security_monitor.html - a real SOS shows up within seconds,
        // so an "active" alert older than 20 minutes is treated as forgotten/test data, not live.
        const STALE_CUTOFF_MS = 20 * 60 * 1000;
        const freshActive = all.filter(a => (a.status === 'active' || a.status === 'acknowledged')
            && (Date.now() - (a.timestamp || 0)) < STALE_CUTOFF_MS).length;

        document.getElementById('p-active').textContent = active;
        document.getElementById('p-today').textContent = todayCount;
        document.getElementById('p-resolved').textContent = totalResolved;

        if (freshActive > 0) {
            document.getElementById('urgent-box').style.display = 'block';
            if (!wasActive) loginPageSiren.play().catch(() => {});
        } else {
            document.getElementById('urgent-box').style.display = 'none';
            loginPageSiren.pause();
            loginPageSiren.currentTime = 0;
        }
        wasActive = freshActive > 0;
    });

    function login() {
        let codeInput = document.getElementById("code").value;
        if (!codeInput) return;

        const btn = document.querySelector('button');
        btn.disabled = true;
        btn.textContent = "VERIFYING...";

        // Ensure we are signed in before reading from the 'officers' node
        firebase.auth().signInAnonymously()
            .then(() => {
                const code = parseInt(codeInput);
                if (isNaN(code)) throw new Error("Please enter a valid numeric code.");

                return db.ref('officers').orderByChild('accessCode').equalTo(code).once('value');
            })
            .then(snapshot => {
                const data = snapshot.val();
                if (data) {
                    const officerId = Object.keys(data).find(id => data[id].active === true);
                    const officer = data[officerId];

                    if (officer) {
                        btn.textContent = "AUTHORIZING...";
                        localStorage.setItem("officerName", officer.name);
                        localStorage.setItem("officerUnit", officer.unit);
                        window.location.href = "security_dashboard.html?v=" + Date.now();
                    } else {
                        btn.disabled = false; btn.textContent = "AUTHORIZE ACCESS";
                        alert("This access code has been deactivated by Admin.");
                    }
                } else {
                    btn.disabled = false; btn.textContent = "AUTHORIZE ACCESS";
                    alert("Invalid Access Code! Please check the code provided by Admin.");
                }
            })
            .catch((err) => {
                btn.disabled = false;
                btn.textContent = "AUTHORIZE ACCESS";
                console.error("Login error:", err);
                alert("Login Error: " + err.message);
            });
    }
</script>
</body>
</html>
